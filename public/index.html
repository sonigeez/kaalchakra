<body>
<div id="app">
  <svg id="map" aria-label="Map of the Indian subcontinent"></svg>
  <div class="band-top" aria-hidden="true"></div>
  <div class="band-side" aria-hidden="true"></div>

  <header class="brand">
    <div class="logo"><svg id="chakra" class="chakra" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10.3" fill="none" stroke-width="1.4"/><circle cx="12" cy="12" r="1.8"/><g stroke-width=".55"><path d="M12 12L21.00 12.00"/><path d="M12 12L20.69 14.33"/><path d="M12 12L19.79 16.50"/><path d="M12 12L18.36 18.36"/><path d="M12 12L16.50 19.79"/><path d="M12 12L14.33 20.69"/><path d="M12 12L12.00 21.00"/><path d="M12 12L9.67 20.69"/><path d="M12 12L7.50 19.79"/><path d="M12 12L5.64 18.36"/><path d="M12 12L4.21 16.50"/><path d="M12 12L3.31 14.33"/><path d="M12 12L3.00 12.00"/><path d="M12 12L3.31 9.67"/><path d="M12 12L4.21 7.50"/><path d="M12 12L5.64 5.64"/><path d="M12 12L7.50 4.21"/><path d="M12 12L9.67 3.31"/><path d="M12 12L12.00 3.00"/><path d="M12 12L14.33 3.31"/><path d="M12 12L16.50 4.21"/><path d="M12 12L18.36 5.64"/><path d="M12 12L19.79 7.50"/><path d="M12 12L20.69 9.67"/></g></svg>Kaalchakra <span class="deva">कालचक्र</span></div>
  </header>

  <section class="yearbox" aria-live="polite">
    <div id="era" class="era"></div>
    <div id="year" class="year"></div>
    <div id="samvat" class="samvat"></div>
    <div id="headline" class="headline"></div>
    <button id="ticker" class="ticker" hidden></button>
    <button id="cta-home" class="cta">Who ruled your city? <span aria-hidden="true">→</span></button>
  </section>

  <nav class="actions">
    <button id="btn-home" class="link">Your city</button>
    <button id="btn-journeys" class="link">Journeys</button>
    <button id="btn-share" class="link">Share</button>
    <button id="btn-about" class="link">About</button>
    <button id="btn-quiz" class="primary"><span class="d">Daily quiz</span><span class="m">Quiz</span></button>
  </nav>

  <aside id="legend" class="legend"></aside>

  <section id="card" class="card" hidden></section>

  <footer class="timeline">
    <button id="play" class="play" aria-label="Play"><svg viewBox="0 0 16 16" aria-hidden="true"><path class="i-play" d="M5 3.5v9l7.5-4.5z"/><path class="i-pause" d="M4.5 3.5h2.5v9H4.5zM9 3.5h2.5v9H9z"/></svg></button>
    <div id="track" class="track" role="slider" tabindex="0" aria-label="Year">
      <div class="eras"></div>
      <div class="minor"></div>
      <div class="evdots"></div>
      <div class="ticks"></div>
      <div id="handle" class="handle"></div>
      <div id="hbubble" class="hbubble" aria-hidden="true"></div>
    </div>
  </footer>

  <div id="intro" class="intro" hidden></div>
  <div id="modal" class="modal" hidden><div class="modal-inner"></div></div>
  <div id="toast" class="toast" hidden></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
